<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifyFirst</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="launcher">
    <div class="launcher-brand">
      <img class="launcher-logo" src="../assets/logo-mark.svg" height="40" alt="VerifyFirst" />
      <span class="launcher-title">VerifyFirst</span>
    </div>
    <div class="launcher-subtitle">Security Center</div>

    <div class="launcher-status" id="launcher-status">
      <span class="status-dot"></span>
      <span class="status-text">Protection Active</span>
    </div>

    <button type="button" class="btn-open-center" id="btn-open-center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      Open Security Center
    </button>

    <div class="launcher-stats" id="launcher-stats">
      <div class="stat-item safe" id="stat-safe">
        <span class="stat-count">–</span>
        <span class="stat-label">Safe</span>
      </div>
      <div class="stat-item suspicious" id="stat-suspicious">
        <span class="stat-count">–</span>
        <span class="stat-label">Suspicious</span>
      </div>
      <div class="stat-item dangerous" id="stat-dangerous">
        <span class="stat-count">–</span>
        <span class="stat-label">Dangerous</span>
      </div>
    </div>

    <div class="launcher-footer" id="launcher-footer">
      <span id="footer-text">Scanning links in real-time</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
